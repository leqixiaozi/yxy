map $http_x_forwarded_proto $yxy_https {
    default off;
    https on;
}

server {
    listen 80;
    server_name www.yxykjai.com;
    root /var/www/html;
    index index.php;
    server_tokens off;
    client_max_body_size 24m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Security rules precede static regex locations. Only index.php executes.
    location ~ (^|/)\.(?!well-known(?:/|$)) { return 404; }
    location ~* ^/(cache|bin|logs|backup|tmp|tests|vendor|webserver-configs)(/|$) { return 404; }
    location ~* ^/user/(env/[^/]+/)?(config|accounts|data)(/|$) { return 404; }
    location ~* ^/(system|user)/.*\.(txt|md|json|yaml|yml|php[0-9]*|phar|phtml|pl|py|cgi|twig|sh|bat)$ { return 404; }
    location ~* ^/(LICENSE\.txt|composer\.(json|lock)|CHANGELOG\.md|README\.md|SECURITY\.md|now\.json)$ { return 404; }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS $yxy_https;
        fastcgi_pass php:9000;
        fastcgi_read_timeout 65s;
    }
    location ~* \.(php[0-9]*|phar|phtml|pht|phps)(/|$) { return 404; }
    location ~* /_app/immutable/.*\.(js|css|woff2?)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(jpe?g|png|gif|webp|avif|ico|svg|pdf|css|js|woff2?|ttf|otf)$ {
        try_files $uri /index.php?$query_string;
        expires 1d;
        access_log off;
    }
}
