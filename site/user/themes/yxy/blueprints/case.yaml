title: 客户案例
extends@:
  type: default
  context: 'blueprints://pages'
form:
  fields:
    tabs:
      fields:
        content:
          title: 案例内容
          fields:
            header.title:
              label: 案例标题
            header.industry:
              type: text
              label: 所属行业
            header.service:
              type: text
              label: 服务内容
            header.summary:
              type: textarea
              label: 案例摘要
            content:
              label: 案例正文
              help: 建议按项目背景、实施内容、实际成果组织；本地试用请明确标注测试。
            header.media_order:
              label: 案例配图与附件
            header.demo:
              type: toggle
              label: 仅作为本地演示
              help: 演示记录保留在后台，但不会进入官网列表、首页推荐及导航。
              default: 0
              options:
                1: 是
                0: 否
              validate:
                type: bool
        options:
          title: 发布设置
        advanced:
          title: 页面设置
